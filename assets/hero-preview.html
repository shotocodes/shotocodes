<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Preview — Isometric</title>
  <style>
    :root {
      --bg: #100d24;
      --bg2: #1b1638;
      --accent: #8b7dff;
      --text: #ECEAFB;
      --muted: #9a93c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Noto Sans JP", sans-serif;
      background: radial-gradient(120% 120% at 70% 10%, var(--bg2), var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 64px 40px;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 32px;
      align-items: center;
    }
    .hero__copy { max-width: 460px; }
    .eyebrow {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 22px;
      padding: 6px 14px;
      border: 1px solid rgba(139, 125, 255, 0.3);
      border-radius: 999px;
    }
    h1 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 22px;
    }
    h1 .grad {
      background: linear-gradient(120deg, #8b7dff, #5ad1c7 60%, #fbbf24);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.lead {
      font-size: 18px;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .cta {
      display: inline-flex;
      gap: 14px;
      align-items: center;
    }
    .btn {
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn--primary {
      background: linear-gradient(120deg, #6d5efc, #8b7dff);
      color: #fff;
      box-shadow: 0 12px 30px -8px rgba(109, 94, 252, 0.6);
    }
    .btn--ghost { color: var(--text); border: 1px solid rgba(255, 255, 255, 0.18); }
    .btn:hover { transform: translateY(-2px); }
    .hero__art {
      position: relative;
      animation: float 6s ease-in-out infinite;
    }
    .hero__art img { width: 100%; height: auto; display: block; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero__copy { margin: 0 auto; }
      .cta { justify-content: center; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__copy">
      <span class="eyebrow">Full-stack dev &amp; designer</span>
      <h1>Building products for people who want to <span class="grad">live free</span>.</h1>
      <p class="lead">
        Tokyo / Bangkok / Chiang Mai。プロダクトを通じて、自由に生きたい人のための
        体験を作っています。
      </p>
      <div class="cta">
        <a class="btn btn--primary" href="#">View work</a>
        <a class="btn btn--ghost" href="#">Get in touch</a>
      </div>
    </div>
    <div class="hero__art">
      <img src="./hero-isometric.svg" alt="Isometric developer workspace illustration" />
    </div>
  </section>
</body>
</html>
